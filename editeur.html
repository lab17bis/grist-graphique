<!doctype html>
<html lang="fr" data-fr-scheme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://docs.getgrist.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Éditeur de tableaux de bord</title>
  <link rel="stylesheet" href="vendor/dsfr/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/utility/icons/icons.min.css" integrity="sha384-S+ttVpcWWHLn1CEGnBmT+A2KKDlXcNJ/vo6Qh/XYK7/0Lo+X/gM2k1vf5fDkssFu" crossorigin="anonymous">
  <link rel="stylesheet" href="css/page.css?v=1">
  <link rel="stylesheet" href="css/tableau.css?v=3">
  <link rel="stylesheet" href="css/editeur.css?v=1">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
  <div class="ed-barre">
    <div class="ed-barre__titre">
      <p class="ed-nom">Tableau de bord</p>
      <p class="fr-badge fr-badge--sm" id="etat">Chargement…</p>
    </div>
    <fieldset class="fr-segmented fr-segmented--sm">
      <legend class="fr-segmented__legend fr-sr-only">Vue de l'éditeur</legend>
      <div class="fr-segmented__elements">
        <div class="fr-segmented__element"><input value="blocs" checked type="radio" id="o-blocs" name="onglet"><label class="fr-label" for="o-blocs">Blocs</label></div>
        <div class="fr-segmented__element"><input value="filtres" type="radio" id="o-filtres" name="onglet"><label class="fr-label" for="o-filtres">Filtres</label></div>
        <div class="fr-segmented__element"><input value="page" type="radio" id="o-page" name="onglet"><label class="fr-label" for="o-page">En-tête et pied</label></div>
        <div class="fr-segmented__element"><input value="apercu" type="radio" id="o-apercu" name="onglet"><label class="fr-label" for="o-apercu">Aperçu</label></div>
        <div class="fr-segmented__element"><input value="publication" type="radio" id="o-publication" name="onglet"><label class="fr-label" for="o-publication">Publication</label></div>
      </div>
    </fieldset>
    <a class="fr-btn fr-btn--sm fr-btn--tertiary" id="voir-tableau" href="index.html">Voir le tableau de bord</a>
    <button type="button" class="fr-btn fr-btn--sm fr-icon-save-line fr-btn--icon-left" id="enregistrer">Enregistrer</button>
  </div>
  <div id="message" class="ed-message" aria-live="polite"></div>
  <main id="vue" class="ed-vue"></main>

  <script src="vendor/echarts/echarts.min.js?v=6.1.0"></script>
  <script src="vendor/echarts/langFR.js?v=6.1.0"></script>
  <script src="js/page-dsfr.js?v=1"></script>
  <script src="js/page-editeur.js?v=5"></script>
  <script src="js/calcul.js?v=1"></script>
  <script src="js/donnees.js?v=1"></script>
  <script src="js/tableau.js?v=6"></script>
  <script src="js/editeur.js?v=5"></script>
</body>
</html>
